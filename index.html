    <style>
        /* Custom font import for better presentation look */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            width: 100vw;
            transition: background-color 0.5s;
            /* Allow content expansion and natural scrolling */
            min-height: 100vh;
            overflow-x: hidden; /* Prevent horizontal scroll */
        }
        
        /* Removed strict height and overflow: hidden from body, 
           relying on min-height and natural document flow. */
        
        /* Ensure HTML element allows content to expand */
        html {
            overflow-y: auto;
        }

        /* Keyframes for a subtle entrance animation */
        @keyframes fadeInSlide {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animated-card {
            animation: fadeInSlide 0.5s ease-out forwards;
        }

        .data-arrow {
            width: 4px;
            height: 30px; /* Further reduced height for space efficiency */
            background-color: #4b5563; /* Gray 600 */
            position: relative;
            margin: 0 auto;
            border-radius: 2px;
            opacity: 0.8;
            transition: background-color 0.3s;
        }

        .data-arrow::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: -8px;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid #4b5563;
            transition: border-top-color 0.3s;
        }

        .expensive-callout {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(150px, -150px) rotate(15deg);
            background-color: #dc2626; /* Red 600 */
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-weight: 800;
            box-shadow: 0 4px 10px rgba(220, 38, 38, 0.4);
            animation: shake 0.5s infinite alternate;
        }

        @keyframes shake {
            from { transform: translate(150px, -150px) rotate(10deg); }
            to { transform: translate(145px, -155px) rotate(18deg); }
        }

        /* Qbeast Brand Glow Animation (Pink/Magenta - #DB2777) */
        @keyframes qbeastGlow {
            0%, 100% { box-shadow: 0 0 0px #db2777, 0 0 0px #db2777; border-color: #db2777; }
            50% { box-shadow: 0 0 20px #db2777, 0 0 40px #db2777; border-color: #f472b6; } 
        }
        .qbeast-glowing-card {
            animation: qbeastGlow 1.5s infinite ease-in-out alternate;
        }

        /* e6data Brand Glow Animation (Vibrant Purple - #6D28D9) */
        @keyframes e6dataGlow {
            0%, 100% { box-shadow: 0 0 0px #6d28d9, 0 0 0px #6d28d9; border-color: #6d28d9; }
            50% { box-shadow: 0 0 20px #6d28d9, 0 0 40px #6d28d9; border-color: #a78bfa; } /* Violet-700 / Violet-400 */
        }
        .e6data-glowing-card {
            animation: e6dataGlow 1.5s infinite ease-in-out alternate;
            cursor: pointer; /* Indicate clickability */
        }
        
        /* Modal Styles */
        .modal-overlay {
            position: fixed; /* Use fixed positioning to always cover the viewport */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        .modal-content {
            background-color: #1f2937; /* Darker than background */
            border-radius: 0.75rem;
            padding: 2rem;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            transform: scale(1);
            animation: modalPop 0.3s ease-out forwards;
            border: 2px solid #6d28d9; /* e6data brand border */
        }

        @keyframes modalPop {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>

                // Render the main layer card
                html.push(`
                    <div id="${layer.id}-card" class="animated-card ${bg} p-4 md:p-6 rounded-xl shadow-2xl w-full max-w-lg ${border} transition duration-300 ${glowClass}" ${clickHandler} style="animation-delay: ${index * 0.3}s;">
                        <div class="flex items-center justify-center space-x-4">
                            ${getIconSvg(layer.icon, color)}
                            <div>
                                <h2 class="text-xl md:text-2xl font-bold text-white">${layer.title} ${isHighlight ? ` (${pageData.solution.toUpperCase()} OPTIMIZED)` : ''}</h2>
                                <p class="text-md md:text-lg ${color} mt-1">${customSubtitle}</p>
                            </div>
                        </div>
                        <p class="text-gray-400 mt-2 text-sm">${detail}</p>
                    </div>
                `);

                // Insert the Qbeast Layer if applicable, right after the Table Format layer
                if (layer.id === 'format' && isQbeastPresent) {
                    const qbeastGlowClass = pageData.solution === 'Qbeast' ? 'qbeast-glowing-card' : ''; // Apply glow only for Qbeast page

                    html.push(`
                        <div class="data-arrow animated-card" style="background-color: ${QBEAST_COLOR}; animation-delay: ${(index + 0.5) * 0.3}s;"></div>
                        <div class="animated-card ${QBEAST_BG_COLOR} p-3 md:p-4 rounded-xl shadow-2xl w-full max-w-lg ${QBEAST_BORDER_COLOR.replace('border-', 'border-2 border-')} transition duration-300 ${qbeastGlowClass}" style="animation-delay: ${(index + 1) * 0.3}s;">
                            <div class="flex items-center justify-center space-x-4">
                                ${getIconSvg('qbeast_logo', QBEAST_TEXT_COLOR)}
                                <div>
                                    <h2 class="text-xl font-bold text-white">Qbeast Indexing Layer</h2>
                                    <p class="text-md ${QBEAST_TEXT_COLOR} mt-1">Multi-Dimensional Clustering & Sampling</p>
                                </div>
                            </div>
                            <p class="text-gray-400 mt-2 text-sm">
                                **Core Optimization:** Rewrites data to enable fast data skipping and smart sampling, minimizing I/O and boosting query speed (2-6x faster).
                            </p>
                        </div>
                    `);
                }


                // Render arrows, ensuring the last layer (Storage) doesn't get one
                if (layer.id !== 'storage') {
                    // Adjust arrow color based on active solution
                    let arrowColor = '#4b5563'; // Default Gray
                    if (isE6dataPage && layer.id === 'compute') {
                        arrowColor = E6DATA_COLOR;
                    } else if (isQbeastPresent && layer.id === 'format') {
                        arrowColor = QBEAST_COLOR;
                    } else if (isHybridPage) {
                        // Hybrid uses Qbeast and E6Data colors for the relevant arrows
                        if (layer.id === 'compute') {
                            arrowColor = E6DATA_COLOR;
                        } else if (layer.id === 'format') {
                            arrowColor = QBEAST_COLOR;
                        }
                    }
                    
                    const arrowDelay = isQbeastPresent && layer.id === 'format' ? (index + 2) * 0.3 : (index + 1) * 0.3;

                    html.push(`
                        <div class="data-arrow animated-card" style="background-color: ${arrowColor}; animation-delay: ${arrowDelay}s;"></div>
                    `);
                }
            });

            return html.join('');
        };

        const renderSavings = (savings) => `
            <div class="mt-4 p-4 bg-green-900/40 rounded-xl max-w-md mx-auto animated-card" style="animation-delay: 2.5s;">
                <h3 class="text-xl font-bold text-green-400">Estimated Cost Savings</h3>
                <p class="text-4xl font-extrabold text-green-300 mt-2">${savings}</p>
            </div>
        `;

        const renderPage = (pageName, prevChoice = 'none') => {
            const container = document.getElementById('app-container');
            container.innerHTML = '';
            
            // Set the container class to allow top alignment and responsive padding
            container.className = "pt-6 p-4 md:pt-8 md:p-8 w-11/12 max-w-5xl text-center relative mx-auto flex flex-col items-center justify-start"; 
            
            // Reset body class.
            document.body.className = "bg-gray-900 text-gray-50";

            closeModal(); // Ensure modal is closed on page change

            let content = '';
            let title = '';

            // Apply strict vertical centering (h-screen) only to pages with minimal content.
            // All other pages will flow naturally, allowing scroll.
            if (pageName === 'challenge' || pageName === 'decision') {
                container.classList.add('justify-center', 'min-h-[100vh]'); // Use min-h-screen for centering when content is small
            } else {
                container.classList.remove('justify-center', 'min-h-[100vh]');
                container.classList.add('justify-start');
            }


            switch (pageName) {
                case 'challenge':
                    title = 'The Lakehouse Challenge: Compute Costs';
                    content = `
                        <h1 class="text-4xl md:text-5xl font-extrabold text-red-400 mb-8 md:mb-10 tracking-tight animated-card mt-0">
                            ${title}
                        </h1>

                        <div class="flex flex-col items-center space-y-3 md:space-y-4">
                            ${renderArchitecture({
                                solution: 'challenge', // added solution key for consistency
                                highlight_layers: ['compute'],
                                highlight_color: 'text-red-300',
                                highlight_border: 'border-red-500',
                                highlight_bg: 'bg-red-900/50',
                                highlight_detail: {
                                    compute: '**Resource Intensive:** Running queries on massive datasets requires high-cost, provisioned clusters.',
                                    format: ARCHITECTURE_DATA.find(d => d.id === 'format').description,
                                    storage: ARCHITECTURE_DATA.find(d => d.id === 'storage').description
                                }
                            })}
                        </div>
                        <div class="mt-8 md:mt-12 animated-card flex-shrink-0" style="animation-delay: 2s;">
                            <h2 class="text-2xl md:text-3xl font-semibold text-white mb-4 md:mb-6">Do you want to fix the compute costs here?</h2>
                            <button onclick="renderPage('decision')" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded-full text-lg md:text-xl shadow-lg transition duration-300 transform hover:scale-105">
                                Yes, let's cut costs!
                            </button>
                        </div>
                        <div class="expensive-callout text-xl animated-card" style="animation-delay: 0.5s;">
                            EXPENSIVE
                        </div>
                    `;
                    break;

                case 'decision':
                    title = 'Where Should We Focus the Optimization?';
                    content = `
                        <h1 class="text-4xl font-extrabold text-indigo-400 mb-8 md:mb-10 tracking-tight animated-card mt-0">
                            ${title}
                        </h1>
                        <p class="text-lg md:text-xl text-gray-300 mb-6 md:mb-10 animated-card flex-shrink-0" style="animation-delay: 0.2s;">
                            Cost efficiency can be achieved by optimizing either the **data** or the **engine**.
                        </p>

                        <div class="flex flex-col md:flex-row space-y-6 md:space-y-0 md:space-x-8 justify-center flex-grow">
                            <div class="flex flex-col items-start p-6 bg-gray-800 rounded-xl shadow-xl border-t-4 ${QBEAST_BORDER_COLOR} animated-card hover:bg-gray-700 transition duration-300" style="animation-delay: 0.5s;">
                                <h3 class="text-2xl font-bold ${QBEAST_TEXT_COLOR} mb-4">Indexing / Storage Layer Fix (Data-First)</h3>
                                <p class="text-gray-400 mb-4">
                                    **Optimization Goal:** Make the data intelligent so the compute engine reads less.
                                </p>
                                <ul class="text-left text-gray-300 mb-8 space-y-2 flex-grow">
                                    <li class="flex items-start">
                                        ${getIconSvg('check', QBEAST_TEXT_COLOR)} 
                                        <span>Implement better data indexing and clustering.</span>
                                    </li>
                                    <li class="flex items-start">
                                        ${getIconSvg('check', QBEAST_TEXT_COLOR)} 
                                        <span>Reduce data scan size on every query.</span>
                                    </li>
                                </ul>
                                <div class="w-full flex justify-center mt-auto flex-shrink-0"> 
                                    <button onclick="renderPage('qbeast', 'storage')" class="bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 px-8 rounded-full text-lg shadow-lg transition duration-300 transform hover:scale-105 w-full">
                                        Select Qbeast Solution
                                    </button>
                                </div>
                            </div>

                            <div class="flex flex-col items-start p-6 bg-gray-800 rounded-xl shadow-xl border-t-4 ${E6DATA_BORDER_COLOR} animated-card hover:bg-gray-700 transition duration-300" style="animation-delay: 0.8s;">
                                <h3 class="text-2xl font-bold ${E6DATA_TEXT_COLOR} mb-4">Compute Layer Fix (Engine-First)</h3>
                                <p class="text-gray-400 mb-6">
                                    **Optimization Goal:** Make the query engine itself run faster and more efficiently.
                                </p>
                                <ul class="text-left text-gray-300 mb-8 space-y-2 flex-grow">
                                    <li class="flex items-start">
                                        ${getIconSvg('check', E6DATA_TEXT_COLOR)} 
                                        <span>Eliminate the need for expensive provisioned Spark.</span>
                                    </li>
                                    <li class="flex items-start">
                                        ${getIconSvg('check', E6DATA_TEXT_COLOR)} 
                                        <span>Use a highly optimized, cloud-native query engine.</span>
                                    </li>
                                </ul>
                                <div class="w-full flex justify-center mt-auto flex-shrink-0"> 
                                    <button onclick="renderPage('e6data', 'compute')" class="bg-violet-600 hover:bg-violet-700 text-white font-bold py-3 px-8 rounded-full text-lg shadow-lg transition duration-300 transform hover:scale-105 w-full">
                                        Select e6data Solution
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    break;

                case 'qbeast':
                    title = 'Qbeast Solution: Optimizing the Storage Layer';
                    const qbeastData = {
                        solution: 'Qbeast',
                        savings: 'Up to 6x Savings', 
                        highlight_layers: ['format', 'storage'], 
                        highlight_color: QBEAST_TEXT_COLOR,
                        highlight_border: QBEAST_BORDER_COLOR,
                        highlight_bg: QBEAST_BG_COLOR,
                        highlight_detail: {
                            compute: 'Queries are faster because they access less data.',
                            format: 'Standard metadata layer (Delta/Iceberg) leveraged by Qbeast.',
                            storage: '**Foundation:** Data is physically clustered by Qbeast for faster retrieval.'
                        }
                    };
                    content = `
                        <h1 class="text-4xl font-extrabold ${QBEAST_TEXT_COLOR} mb-6 md:mb-8 tracking-tight animated-card mt-0">
                            ${title}
                        </h1>
                        <p class="text-lg md:text-xl text-gray-300 mb-4 md:mb-6 animated-card flex-shrink-0" style="animation-delay: 0.2s;">
                            Qbeast optimizes the underlying data structure itself, leading to dramatic reductions in data scanned.
                        </p>

                        <div class="flex flex-col items-center space-y-3 md:space-y-4 flex-grow">
                            ${renderArchitecture(qbeastData)}
                        </div>
                        ${renderSavings(qbeastData.savings)}
                        <div class="mt-4 md:mt-6 animated-card flex-shrink-0" style="animation-delay: 3.5s;">
                            <h2 class="text-2xl md:text-3xl font-semibold text-white mb-4 md:mb-6">Do you still want to cut down on costs?</h2>
                            <button onclick="renderPage('hybrid', 'qbeast')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-full text-lg md:text-xl shadow-lg transition duration-300 transform hover:scale-105">
                                Explore Our Hybrid Solution
                            </button>
                        </div>
                    `;
                    break;

                case 'e6data':
                    title = 'e6data Solution: Optimizing the Compute Layer';
                    const e6dataData = {
                        solution: 'e6data',
                        savings: 'Up to 5x Savings',
                        highlight_layers: ['compute'],
                        highlight_color: E6DATA_TEXT_COLOR,
                        highlight_border: E6DATA_BORDER_COLOR,
                        highlight_bg: E6DATA_BG_COLOR,
                        highlight_detail: {
                            compute: 'Click to see **e6data’s core optimizations** that eliminate expensive clusters and boost speed.',
                            format: ARCHITECTURE_DATA.find(d => d.id === 'format').description,
                            storage: ARCHITECTURE_DATA.find(d => d.id === 'storage').description
                        }
                    };
                    content = `
                        <h1 class="text-4xl font-extrabold ${E6DATA_TEXT_COLOR} mb-6 md:mb-8 tracking-tight animated-card mt-0">
                            ${title}
                        </h1>
                        <p class="text-lg md:text-xl text-gray-300 mb-4 md:mb-6 animated-card flex-shrink-0" style="animation-delay: 0.2s;">
                            e6data replaces slow, expensive Spark with a cloud-native query engine that processes data much faster.
                        </p>

                        <div class="flex flex-col items-center space-y-3 md:space-y-4 flex-grow">
                            ${renderArchitecture(e6dataData)}
                        </div>
                        ${renderSavings(e6dataData.savings)}
                        <div class="mt-8 md:mt-10 animated-card flex-shrink-0" style="animation-delay: 2.5s;">
                            <h2 class="text-2xl md:text-3xl font-semibold text-white mb-4 md:mb-6">Do you still want to cut down on costs?</h2>
                            <button onclick="renderPage('hybrid', 'e6data')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-full text-lg md:text-xl shadow-lg transition duration-300 transform hover:scale-105">
                                Explore Our Hybrid Solution
                            </button>
                        </div>
                    `;
                    break;

                case 'hybrid':
                    title = 'The Ultimate Hybrid Solution: Qbeast + e6data';
                    const hybridData = {
                        solution: 'Hybrid',
                        savings: 'Up to 10x+ Savings', // Updated savings
                        highlight_layers: ['compute', 'format', 'storage'], // All layers benefit
                        // Removed highlight_color, border, bg as they are now set dynamically in renderArchitecture
                        highlight_detail: {
                            compute: '**e6data Acceleration:** Highly efficient engine processes optimized data at maximum speed.',
                            format: 'Standard metadata layer (Delta/Iceberg) used by Qbeast.',
                            storage: '**Foundation:** Data is physically clustered and stored cost-effectively.'
                        }
                    };
                    content = `
                        <h1 class="text-4xl font-extrabold text-green-400 mb-6 md:mb-8 tracking-tight animated-card mt-0">
                            ${title}
                        </h1>
                        <p class="text-lg md:text-xl text-gray-300 mb-4 md:mb-6 animated-card flex-shrink-0" style="animation-delay: 0.2s;">
                            By combining **Qbeast's intelligent data layout** and **e6data's lightning-fast engine**, you achieve maximum cost and performance benefits.
                        </p>

                        <div class="flex flex-col items-center space-y-3 md:space-y-4 flex-grow">
                            ${renderArchitecture(hybridData)}
                        </div>
                        ${renderSavings(hybridData.savings)}

                        <div class="mt-4 md:mt-6 animated-card flex-shrink-0" style="animation-delay: 3.5s;">
                            <h2 class="text-2xl md:text-3xl font-semibold text-white mb-4 md:mb-6">Ready to maximize your cost efficiency?</h2>
                            <button onclick="renderPage('challenge')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-full text-lg md:text-xl shadow-lg transition duration-300 transform hover:scale-105">
                                Home Page
                            </button>
                        </div>
                    `;
                    break;
            }

            container.innerHTML = content;
        };

        // Initialize the presentation
        window.onload = () => {
            renderPage('challenge');
        };
    </script>
</body>
</html>
